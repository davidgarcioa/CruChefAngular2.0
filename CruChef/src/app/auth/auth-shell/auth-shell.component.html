<main class="auth-layout">
  <section class="auth-aside">
    <p class="eyebrow">{{ eyebrow }}</p>
    <h1>{{ title }}</h1>
    <p class="lead">{{ subtitle }}</p>
  </section>

  <section class="auth-panel">
    @if (showBrand) {
      <div class="brand">
        <img class="brand-logo" src="/LogoCruChef.png" alt="CruChef" />
      </div>
    }

    <ng-content />
  </section>
</main>
