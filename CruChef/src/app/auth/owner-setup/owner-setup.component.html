<app-auth-shell
  eyebrow="Propietario"
  title="Crea tu primer restaurante"
  subtitle="Antes de entrar al panel de propietario, registra los datos legales y operativos de tu negocio."
  alternateText="Quieres volver a escoger un perfil?"
  alternateLabel="Cambiar rol"
  alternateRoute="/select-role"
>
  <section class="setup-card">
    <h2>Datos del restaurante</h2>
    <p>Estos datos quedaran vinculados al correo con el que iniciaste sesion.</p>

    @if (errorMessage()) {
      <p class="status-message">{{ errorMessage() }}</p>
    }

    <form class="setup-form" [formGroup]="restaurantForm" (ngSubmit)="submit()">
      <label class="field">
        <span>Nombre del restaurante</span>
        <input type="text" formControlName="name" placeholder="Ej. CruChef House" />
        @if (restaurantForm.controls.name.touched && restaurantForm.controls.name.invalid) {
          @if (restaurantForm.controls.name.hasError('required') || restaurantForm.controls.name.hasError('trimmedRequired')) {
            <small>El nombre del restaurante es obligatorio.</small>
          } @else if (restaurantForm.controls.name.hasError('minlength')) {
            <small>El nombre debe tener al menos 2 caracteres.</small>
          } @else if (restaurantForm.controls.name.hasError('maxlength')) {
            <small>El nombre no puede superar 80 caracteres.</small>
          }
        }
      </label>

      <label class="field">
        <span>Direccion</span>
        <input type="text" formControlName="address" placeholder="Ej. Carrera 10 # 20-30" />
        @if (restaurantForm.controls.address.touched && restaurantForm.controls.address.invalid) {
          @if (restaurantForm.controls.address.hasError('required') || restaurantForm.controls.address.hasError('trimmedRequired')) {
            <small>La direcci&oacute;n es obligatoria.</small>
          } @else if (restaurantForm.controls.address.hasError('minlength')) {
            <small>La direcci&oacute;n debe tener al menos 5 caracteres.</small>
          } @else if (restaurantForm.controls.address.hasError('maxlength')) {
            <small>La direcci&oacute;n no puede superar 120 caracteres.</small>
          }
        }
      </label>

      <div class="field-grid">
        <label class="field">
          <span>Ciudad</span>
          <input type="text" formControlName="city" placeholder="Ej. Bogota" />
          @if (restaurantForm.controls.city.touched && restaurantForm.controls.city.invalid) {
            @if (restaurantForm.controls.city.hasError('required') || restaurantForm.controls.city.hasError('trimmedRequired')) {
              <small>La ciudad es obligatoria.</small>
            } @else if (restaurantForm.controls.city.hasError('minlength')) {
              <small>La ciudad debe tener al menos 2 caracteres.</small>
            } @else if (restaurantForm.controls.city.hasError('maxlength')) {
              <small>La ciudad no puede superar 60 caracteres.</small>
            } @else if (restaurantForm.controls.city.hasError('pattern')) {
              <small>La ciudad solo puede contener letras, espacios, puntos o guiones.</small>
            }
          }
        </label>

        <label class="field">
          <span>Telefono</span>
          <input type="text" formControlName="phone" placeholder="Ej. 3001234567" />
          @if (restaurantForm.controls.phone.touched && restaurantForm.controls.phone.invalid) {
            @if (restaurantForm.controls.phone.hasError('required') || restaurantForm.controls.phone.hasError('trimmedRequired')) {
              <small>El tel&eacute;fono es obligatorio.</small>
            } @else if (restaurantForm.controls.phone.hasError('minlength')) {
              <small>El tel&eacute;fono debe tener al menos 7 d&iacute;gitos.</small>
            } @else if (restaurantForm.controls.phone.hasError('maxlength')) {
              <small>El tel&eacute;fono no puede superar 15 d&iacute;gitos.</small>
            } @else if (restaurantForm.controls.phone.hasError('pattern')) {
              <small>El tel&eacute;fono solo puede contener n&uacute;meros.</small>
            }
          }
        </label>
      </div>

      <div class="field-grid">
        <label class="field">
          <span>Horarios</span>
          <input type="text" formControlName="schedule" placeholder="Lun-Dom 8:00 AM - 10:00 PM" />
          @if (restaurantForm.controls.schedule.touched && restaurantForm.controls.schedule.invalid) {
            @if (restaurantForm.controls.schedule.hasError('required') || restaurantForm.controls.schedule.hasError('trimmedRequired')) {
              <small>El horario es obligatorio.</small>
            } @else if (restaurantForm.controls.schedule.hasError('minlength')) {
              <small>El horario debe tener al menos 3 caracteres.</small>
            } @else if (restaurantForm.controls.schedule.hasError('maxlength')) {
              <small>El horario no puede superar 80 caracteres.</small>
            }
          }
        </label>

        <label class="field">
          <span>RUT</span>
          <input type="text" formControlName="rut" placeholder="Numero de RUT" />
          @if (restaurantForm.controls.rut.touched && restaurantForm.controls.rut.invalid) {
            @if (restaurantForm.controls.rut.hasError('required') || restaurantForm.controls.rut.hasError('trimmedRequired')) {
              <small>El RUT es obligatorio.</small>
            } @else if (restaurantForm.controls.rut.hasError('minlength')) {
              <small>El RUT debe tener al menos 6 caracteres.</small>
            } @else if (restaurantForm.controls.rut.hasError('maxlength')) {
              <small>El RUT no puede superar 20 caracteres.</small>
            } @else if (restaurantForm.controls.rut.hasError('pattern')) {
              <small>El RUT solo puede contener letras, n&uacute;meros, puntos o guiones.</small>
            }
          }
        </label>
      </div>

      <button type="submit" class="primary-button" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Creando...' : 'Crear mi primer restaurante' }}
      </button>
    </form>
  </section>
</app-auth-shell>
