<app-auth-shell
  eyebrow="Crea tu cuenta"
  title="Registro"
  subtitle="Completa tus datos para crear acceso al panel administrativo de CruChef."
  alternateText="Ya tienes cuenta?"
  alternateLabel="Inicia sesi&oacute;n"
  alternateRoute="/login"
>
  <section class="auth-card">
    <div class="card-copy">
      <h2>Registro</h2>
      <p>Solicitamos los datos b&aacute;sicos para crear el acceso.</p>
    </div>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      @if (errorMessage()) {
        <p class="status-message status-message--error">{{ errorMessage() }}</p>
      }

      <label class="field">
        <span>Nombre completo</span>
        <input type="text" formControlName="fullName" placeholder="Tu nombre" />
        @if (form.controls.fullName.touched && form.controls.fullName.invalid) {
          @if (form.controls.fullName.hasError('required') || form.controls.fullName.hasError('trimmedRequired')) {
            <small>El nombre completo es obligatorio.</small>
          } @else if (form.controls.fullName.hasError('minlength')) {
            <small>El nombre debe tener al menos 3 caracteres.</small>
          } @else if (form.controls.fullName.hasError('maxlength')) {
            <small>El nombre no puede superar 80 caracteres.</small>
          } @else if (form.controls.fullName.hasError('pattern')) {
            <small>Usa solo letras, espacios, puntos o guiones.</small>
          }
        }
      </label>

      <label class="field">
        <span>Correo electr&oacute;nico</span>
        <input type="email" formControlName="email" placeholder="correo@cruchef.com" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          @if (form.controls.email.hasError('required') || form.controls.email.hasError('trimmedRequired')) {
            <small>El correo electr&oacute;nico es obligatorio.</small>
          } @else if (form.controls.email.hasError('email')) {
            <small>Ingresa un correo electr&oacute;nico v&aacute;lido.</small>
          } @else if (form.controls.email.hasError('maxlength')) {
            <small>El correo electr&oacute;nico es demasiado largo.</small>
          }
        }
      </label>

      <label class="field">
        <span>N&uacute;mero de documento</span>
        <input type="text" formControlName="documentNumber" placeholder="Documento" />
        @if (form.controls.documentNumber.touched && form.controls.documentNumber.invalid) {
          @if (form.controls.documentNumber.hasError('required') || form.controls.documentNumber.hasError('trimmedRequired')) {
            <small>El documento es obligatorio.</small>
          } @else if (form.controls.documentNumber.hasError('minlength')) {
            <small>El documento debe tener al menos 6 d&iacute;gitos.</small>
          } @else if (form.controls.documentNumber.hasError('maxlength')) {
            <small>El documento no puede superar 20 d&iacute;gitos.</small>
          } @else if (form.controls.documentNumber.hasError('pattern')) {
            <small>El documento solo puede contener n&uacute;meros.</small>
          }
        }
      </label>

      <label class="field">
        <span>Contrase&ntilde;a</span>
        <input type="password" formControlName="password" placeholder="M&iacute;nimo 6 caracteres" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          @if (form.controls.password.hasError('required')) {
            <small>La contrase&ntilde;a es obligatoria.</small>
          } @else if (form.controls.password.hasError('minlength')) {
            <small>La contrase&ntilde;a debe tener al menos 6 caracteres.</small>
          } @else if (form.controls.password.hasError('maxlength')) {
            <small>La contrase&ntilde;a no puede superar 64 caracteres.</small>
          }
        }
      </label>

      <label class="field">
        <span>Confirmar contrase&ntilde;a</span>
        <input type="password" formControlName="confirmPassword" placeholder="Repite tu contrase&ntilde;a" />
        @if (form.controls.confirmPassword.touched && form.controls.confirmPassword.invalid) {
          @if (form.controls.confirmPassword.hasError('required')) {
            <small>Confirma tu contrase&ntilde;a.</small>
          } @else if (form.controls.confirmPassword.hasError('maxlength')) {
            <small>La confirmaci&oacute;n no puede superar 64 caracteres.</small>
          }
        } @else if (form.controls.confirmPassword.touched && form.hasError('passwordMismatch')) {
          <small>Las contrase&ntilde;as no coinciden.</small>
        }
      </label>

      <button type="submit" class="submit-button" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="alternate-copy">
      &iquest;Ya tienes cuenta?
      <a routerLink="/login" class="alternate-link">Inicia sesi&oacute;n</a>
    </p>
  </section>
</app-auth-shell>
